name: CI — Build APK & IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Test + Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate platform folders (android/, ios/) from the Flutter templates.
      - name: Generate platform scaffolding
        run: cd app && flutter create --platforms=android,ios --org com.qweq1 --project-name samachat .

      - name: Prepare Android project
        run: bash ci/android-prepare.sh

      - name: Get dependencies
        run: cd app && flutter pub get

      - name: Analyze (non-blocking)
        run: cd app && flutter analyze || true

      - name: Run tests
        run: cd app && flutter test

      - name: Build release APK
        run: |
          cd app
          SERVER="${{ vars.SAMA_SERVER }}"
          SERVER="${SERVER:-https://refrain-tapping-crazy.ngrok-free.dev}"
          flutter build apk --release --dart-define=SAMA_SERVER=$SERVER

      - name: Verify APK signing certificate
        run: |
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          grep -q "CN=sama-chat" /tmp/apk-certs.txt || { echo "::error::APK 未使用固定签名密钥！"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sama-chat-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: cd app && flutter create --platforms=android,ios --org com.qweq1 --project-name samachat .

      - name: Prepare iOS project
        run: bash ci/ios-prepare.sh

      - name: Get dependencies
        run: cd app && flutter pub get

      - name: Build iOS (no codesign)
        run: |
          cd app
          SERVER="${{ vars.SAMA_SERVER }}"
          SERVER="${SERVER:-https://refrain-tapping-crazy.ngrok-free.dev}"
          flutter build ios --release --no-codesign --dart-define=SAMA_SERVER=$SERVER

      - name: Package IPA
        run: bash ci/package-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sama-chat-ipa
          path: app/dist/*.ipa
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        shell: bash
        run: cd app && flutter create --platforms=windows --org com.qweq1 --project-name samachat .

      - name: Prepare Windows project
        shell: bash
        run: bash ci/windows-prepare.sh

      - name: Get dependencies
        shell: bash
        run: cd app && flutter pub get

      - name: Build Windows (release)
        shell: bash
        run: |
          cd app
          SERVER="${{ vars.SAMA_SERVER }}"
          SERVER="${SERVER:-https://refrain-tapping-crazy.ngrok-free.dev}"
          flutter build windows --release --dart-define=SAMA_SERVER=$SERVER

      - name: Package ZIP
        shell: pwsh
        run: |
          $dir = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path $dir)) { $dir = "app/build/windows/runner/Release" }
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath "sama-chat-windows.zip" -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sama-chat-windows
          path: sama-chat-windows.zip
          if-no-files-found: error
