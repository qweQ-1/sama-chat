name: JavaMC
options:
  bundleIdPrefix: com.qweq-1
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  JavaMC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JavaMC
      - path: Clients
        type: folder
        buildPhase: resources
    info:
      path: JavaMC/Info.plist
      properties:
        CFBundleDisplayName: "JavaMC"
        CFBundleName: "JavaMC"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [zh_CN, en]
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresPersistentWiFi: false
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        NSHumanReadableCopyright: "JavaMC · 个人自用构建"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.javamc
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""

schemes:
  JavaMC:
    build:
      targets:
        JavaMC: all
    run:
      config: Debug
    archive:
      config: Release
