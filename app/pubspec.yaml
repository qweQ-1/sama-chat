name: samachat
description: "sama-chat — 私聊 · 群聊 · 炫圈，轻量实时聊天应用"
publish_to: 'none'
version: 2.1.0+21

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0 # 上传前压缩（WebP 瘦身）
  cached_network_image: ^3.4.1   # 图片磁盘缓存，翻记录秒出
  flutter_cache_manager: ^3.4.0 # 磁盘缓存底层（JSON 索引，桌面端兼容）
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.3
  flutter_foreground_task: ^8.0.0
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  video_player: ^2.8.0
  video_player_win: ^3.3.0 # Windows 桌面版视频播放（其他平台自动跳过）
  local_notifier: ^0.1.6 # Windows / macOS / Linux 桌面系统通知

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/silence.wav
